version: '3.9'

services:
    postgres:
        image: postgres:18.3
        container_name: postgres
        restart: always

        environment:
            POSTGRES_USER: dev
            POSTGRES_PASSWORD: dev1234
            POSTGRES_DB: sk_ax

        ports:
            - '5432:5432'

        volumes:
            - postgres_data:/var/lib/postgresql
            - ./config/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

volumes:
    postgres_data:
